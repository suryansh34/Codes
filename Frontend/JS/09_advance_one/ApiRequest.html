<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121;">
    <div class="cards">
  <article class="card">
    <header>
      <h2>A short heading</h2>
    </header>

    <img
      src="https://avatars.githubusercontent.com/u/11613311?v=4" />
    <div class="content">
      <p>
        I make coding videos on youtube and for courses. My youtube channel explains my work more. Check that out.
      </p>

    </div>
    <button class="btn">Get Data</button>
  </article>
</body>
<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    const xhr = new XMLHttpRequest();
    xhr.open('GET', requestUrl)
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState);
        if (xhr.readyState === 4) {
            const data = JSON.parse(this.responseText)
            console.log(typeof data);
            console.log(data.followers);
        }
    }
    xhr.send();

    const button = document.querySelector('.btn');

button.addEventListener('click', function (e) {

    const card = e.target.parentElement;

    const imageUrl = card.querySelector('img').src;
    const paragraph = card.querySelector('p').innerText;

    const content = `Image URL: ${imageUrl}

Description:
${paragraph}`;

    const blob = new Blob([content], { type: 'text/plain' });

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'card-data.txt';

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

});
</script>
</html>
