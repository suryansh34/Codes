<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>

    <!-- <button onclick= {() => { handleClick}</button>>Button Clicked</button>  this is not suitable so we have bind method -->
</body>
<script>
    class React {
        constructor (){
            this.library = "React"
            this.server = "https://google.com";

            // requirement --> refernece , when clicked
            document
            .querySelector('button')
            .addEventListener('click', this.handleClick.bind(this))

        }
        handleClick(){
            console.log("button clicked");
            // console.log(this);
            console.log(this.server);
            
            
        }
    }

    const app = new React()
</script>
</html>
